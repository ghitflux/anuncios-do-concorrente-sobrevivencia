[project]
name = "anuncios-concorrente"
version = "0.1.0"
description = "O que o líder do mercado mantém no ar, e o que isso diz (e não diz) sobre o que funciona? Biblioteca de anúncios lida como dado enviesado por sobrevivência"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jinja2>=3.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anuncios_concorrente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
